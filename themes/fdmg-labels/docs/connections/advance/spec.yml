openapi: 3.0.0
info:
  title: AD-API-1.3.1 - MASTER
  version: 1.0.0
  description: >-
    <p>This documentation provides details of all available ADvance API
    methods.</p>


    <p>Please contact Abacus through your regular support channels should you
    require any further assistance.</p>


    <h3>Header values</h3>


    <p>The following header values are required to be supplied in all API method
    requests:</p>


    <table><tbody><tr><th>HTTP header
    name</th><th>Purpose</th></tr><tr><td>ADAPI_ACCESS_HASH</td><td>This
    contains the access hash uniquely identifying the data domain area into
    which the request is made. Each ADvance brand entity uses a different
    ADAPI_ACCESS_HASH value.</td></tr><tr><td>ADAPI_ACCESS_TOKEN</td><td>This is
    authorization token to perform the operation in question. This value is
    common for a single ADvance
    client/publisher.</td></tr><tr><td>ADAPI_RESPONSE_FORMAT</td><td>This value
    determines the format of the response data. The default is xml. Possible
    values are 'xml' or 'json'.<br></td></tr></tbody></table>


    ### Response handling


    When handling any response from the ADvance API, **there must be
    consideration that additional XML/JSON elements may be added to the schema
    in future**. It should be noted that any existing elements in the response
    schema will not be modified in such changes to ensure compatibility with
    existing integrations.


    <h3>Error handling</h3>


    <p>Handled error responses for API methods are structured as follows:</p>


    ``` xml

    <ad>


    <response version="1">


    <status>


    <code>ERROR</code>


    <messages>


    <msg type="error" code="1">Invalid username/password.</msg>


    </messages>


    </status>


    </response>


    </ad>


    ```


    <p>Unhandled errors resulting from a generic unplanned technical error /
    exception in the method may result in an error code of 0 being returned.
    Such errors should be considered when integrating with the ADvance API
    methods.</p>


    ``` xml

    <ad>


    <response version="1">


    <status>


    <code>ERROR</code>


    <messages>


    <msg type="error" code="0"></msg>


    </messages>


    </status>


    </response>


    </ad>


    ```
