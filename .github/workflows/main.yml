name: Build & test

on:
  push:
    branches:
      - 'master'
      - 'main'
  pull_request_target:
    branches:
      - 'master'
      - 'main'

jobs:
  php:
    name: PHP test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, dom, simplexml
          tools: wp
      - uses: actions/checkout@v4
        with:
          path: wp-content/
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Debugging
        run: |
          php --version
          php -m
          composer --version
      - name: Composer build
        run: |
          cd wp-content/
          composer config --global --auth http-basic.repo.packagist.com token "${{ secrets.PRIVATE_PACKAGIST_TOKEN }}"
          composer install --prefer-dist
        env:
          PRIVATE_PACKAGIST_TOKEN: ${{ secrets.PRIVATE_PACKAGIST_TOKEN }}
      - name: test:composer
        run: |
          cd wp-content/
          composer run test:composer
      - name: test:phpcs
        run: |
          cd wp-content/
          composer run test:phpcs
      - name: test:twigcs
        run: |
          cd wp-content/
          composer run test:twigcs
      # Edit the WordPress install, activated theme and plugins for your test here.
      - name: Download & configure WP
        run: |
          wp core download --allow-root --version=6.6 --skip-content
          wp config create --allow-root --dbname=test --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp config set WP_DEBUG true --allow-root
          wp core install --allow-root  --url=localhost --title=Test --admin_user=admin --admin_password=password --admin_email=admin@test.test
          wp plugin activate gravityforms --allow-root
          wp theme activate fdmg-labels --allow-root
      - name: test:phpstan
        run: |
          cd wp-content/
          composer run test:phpstan
      - name: Start PHP Server
        run: |
          nohup php -S 127.0.0.1:8080 > phpd.log 2>&1 &
      - name: Unit tests complete?
        run: |
          cd wp-content/
          wp db import tests/_data/dump.sql
          composer run test:codeception:ci
      - name: Upload artifact
        uses: actions/upload-artifact@v2
        if: ${{ failure() }}
        with:
          name: acceptance-tests-errors
          path: /home/runner/work/fdmg-labels/fdmg-labels/wp-content/tests/_output/
      - name: test:docs
        run: |
          cd wp-content/
          composer run test:docs
      - name: test:openapi-spec
        run: |
          cd wp-content/
          composer run test:openapi-spec
  npm-project:
    name: NPM test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{github.event.pull_request.head.sha}}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          always-auth: true
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com
          scope: '@level-level'
      - name: Clean install dependencies
        run: |
          cd themes/fdmg-labels
          npm ci
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
      - name: Lint
        run: |
          cd themes/fdmg-labels
          npm run lint
      - name: Build
        run: |
          cd themes/fdmg-labels
          npm run build
      - name: NPM Upload source maps to Sentry
        run: |
          cd themes/fdmg-labels
          npm run build:sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
